name: Release notes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Validate content and generated page
        run: |
          node scripts/build-releases.mjs --check
          node scripts/check-release-notes.mjs
          node scripts/build-pwa.mjs --check
          node --test tests/release-notes.test.mjs tests/pwa.test.mjs
      - name: Require notes for product changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-release-notes.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
